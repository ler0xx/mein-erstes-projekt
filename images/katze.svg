<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">
  <title>Balu, die Katze</title>

  <style>
    .schwanz { transform-origin: 128px 262px; animation: wedeln 3.2s ease-in-out infinite; }
    .augen { transform-origin: 100px 128px; animation: blinzeln 5s ease-in-out infinite; }
    @keyframes wedeln {
      0%, 100% { transform: rotate(0deg); }
      50%      { transform: rotate(-9deg); }
    }
    @keyframes blinzeln {
      0%, 92%, 100% { transform: scaleY(1); }
      96%           { transform: scaleY(0.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .schwanz, .augen { animation: none; }
    }
  </style>

  <!-- Himmel -->
  <rect width="200" height="300" fill="#e8f6ff"/>

  <!-- Wiese -->
  <ellipse cx="100" cy="300" rx="140" ry="28" fill="#8fd16a"/>

  <!-- Schwanz -->
  <path class="schwanz" d="M128 262 C 170 262, 182 230, 172 196 C 166 176, 150 178, 156 192"
        fill="none" stroke="#e8893a" stroke-width="13" stroke-linecap="round"/>

  <!-- Körper -->
  <path d="M60 280 C 52 230, 62 175, 100 168 C 138 175, 148 230, 140 280 Z"
        fill="#f5a04c" stroke="#d27a2c" stroke-width="3" stroke-linejoin="round"/>
  <!-- Bauch -->
  <path d="M80 280 C 76 245, 84 200, 100 196 C 116 200, 124 245, 120 280 Z" fill="#fff1dc"/>
  <!-- Streifen -->
  <g fill="none" stroke="#d27a2c" stroke-width="4" stroke-linecap="round">
    <path d="M64 222 C 72 220, 76 224, 78 230"/>
    <path d="M62 246 C 70 244, 74 248, 77 254"/>
    <path d="M136 222 C 128 220, 124 224, 122 230"/>
    <path d="M138 246 C 130 244, 126 248, 123 254"/>
  </g>
  <!-- Pfoten -->
  <ellipse cx="84" cy="280" rx="14" ry="8" fill="#fff1dc" stroke="#d27a2c" stroke-width="3"/>
  <ellipse cx="116" cy="280" rx="14" ry="8" fill="#fff1dc" stroke="#d27a2c" stroke-width="3"/>

  <!-- Ohren -->
  <path d="M58 118 L 62 62 L 96 92 Z" fill="#f5a04c" stroke="#d27a2c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M142 118 L 138 62 L 104 92 Z" fill="#f5a04c" stroke="#d27a2c" stroke-width="3" stroke-linejoin="round"/>
  <path d="M66 104 L 68 76 L 86 92 Z" fill="#ff9fb8"/>
  <path d="M134 104 L 132 76 L 114 92 Z" fill="#ff9fb8"/>

  <!-- Kopf -->
  <ellipse cx="100" cy="130" rx="50" ry="44" fill="#f5a04c" stroke="#d27a2c" stroke-width="3"/>
  <!-- Stirnstreifen -->
  <g fill="none" stroke="#d27a2c" stroke-width="4" stroke-linecap="round">
    <path d="M100 88 L 100 102"/>
    <path d="M88 91 L 91 103"/>
    <path d="M112 91 L 109 103"/>
  </g>
  <!-- Schnauze -->
  <ellipse cx="100" cy="150" rx="22" ry="16" fill="#fff1dc"/>

  <!-- Augen -->
  <g class="augen">
    <ellipse cx="80" cy="128" rx="9" ry="11" fill="#3a8f4a"/>
    <ellipse cx="120" cy="128" rx="9" ry="11" fill="#3a8f4a"/>
    <ellipse cx="80" cy="128" rx="3" ry="9" fill="#1b1b24"/>
    <ellipse cx="120" cy="128" rx="3" ry="9" fill="#1b1b24"/>
    <circle cx="83" cy="123" r="2.2" fill="#fff"/>
    <circle cx="123" cy="123" r="2.2" fill="#fff"/>
  </g>

  <!-- Nase und Mund -->
  <path d="M94 142 L 106 142 L 100 149 Z" fill="#ff7aa2" stroke="#e0507a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M100 149 C 100 155, 94 158, 90 155 M100 149 C 100 155, 106 158, 110 155"
        fill="none" stroke="#8a4a1c" stroke-width="2" stroke-linecap="round"/>

  <!-- Schnurrhaare -->
  <g stroke="#8a4a1c" stroke-width="1.6" stroke-linecap="round">
    <path d="M82 148 L 44 140"/>
    <path d="M82 153 L 44 156"/>
    <path d="M118 148 L 156 140"/>
    <path d="M118 153 L 156 156"/>
  </g>

  <!-- Bäckchen -->
  <ellipse cx="68" cy="146" rx="7" ry="4" fill="#ff9fb8" opacity="0.6"/>
  <ellipse cx="132" cy="146" rx="7" ry="4" fill="#ff9fb8" opacity="0.6"/>
</svg>
