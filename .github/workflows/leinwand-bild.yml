# Rendert die Ergebnis-Leinwand als Bild und legt es auf den Branch
# leinwand-bild. Dieses Bild hängt als Display an der Wand im Agent Office.
# Der Branch enthält immer nur das neueste Bild (er wird jedes Mal ersetzt),
# damit das Repo nicht mit alten Bildern wächst.
# https://raw.githubusercontent.com/ler0xx/mein-erstes-projekt/leinwand-bild/leinwand.png
name: Leinwand-Bild

on:
  # Läuft mit dem Stand von main, nicht mit dem Code des Pull Requests.
  pull_request_target:
    types: [opened, reopened, closed, edited, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: leinwand-bild
  cancel-in-progress: true

jobs:
  bild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Leinwand rendern
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEINWAND_REPO: ${{ github.repository }}
          CHROME: google-chrome
        run: node leinwand/bild.mjs "$RUNNER_TEMP/bild/leinwand.png"

      - name: Bild auf den Branch leinwand-bild legen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/bild"
          git init -q -b leinwand-bild
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leinwand.png
          git commit -q -m "Leinwand-Bild aktualisieren"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" leinwand-bild
