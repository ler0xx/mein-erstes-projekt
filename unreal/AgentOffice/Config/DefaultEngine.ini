; =====================================================================
; Agent Office – Engine-Einstellungen
; Ziel: fotorealistische Darstellung, vollständig dynamisches Licht.
; =====================================================================

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/Maps/Office.Office
GameDefaultMap=/Game/Maps/Office.Office
GlobalDefaultGameMode=/Script/Engine.GameModeBase

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; DirectX 12 mit Shader Model 6 – Voraussetzung für Nanite, Lumen (HW-RT) und Virtual Shadow Maps
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; --- Globale Beleuchtung & Reflexionen: Lumen ---
; 1 = Lumen für indirektes Licht (Sonne fällt durchs Fenster und erhellt den Raum indirekt)
r.DynamicGlobalIlluminationMethod=1
; 1 = Lumen-Reflexionen (Glas, Bildschirme, glänzende Tischplatten)
r.ReflectionMethod=1
; Hardware-Raytracing für Lumen, wenn GPU/Treiber es können – sonst fällt Lumen automatisch auf Software-Tracing zurück
r.Lumen.HardwareRayTracing=True
r.RayTracing=True
; Skin Cache wird für Raytracing animierter Figuren (Agenten) benötigt
r.SkinCache.CompileShaders=True
; Distanzfelder für Software-Lumen (Fallback ohne HW-RT)
r.GenerateMeshDistanceFields=True
; Kein gebackenes Licht – alles dynamisch, damit Licht sich live ändern kann
r.AllowStaticLighting=False

; --- Schatten: Virtual Shadow Maps (scharfe, detailreiche Schatten) ---
r.Shadow.Virtual.Enable=1

; --- Geometrie: Nanite (sehr detailreiche Möbel/Assets ohne LOD-Handarbeit) ---
r.Nanite.ProjectEnabled=True

; --- Kantenglättung: Temporal Super Resolution ---
r.AntiAliasingMethod=4
r.TemporalAA.Upsampling=True

; --- Belichtung: physikalisch plausible Helligkeitswerte (EV100) ---
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.Method=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

; --- Sonstiges für realistische Bilder ---
r.DefaultFeature.MotionBlur=False
r.SupportSkyAtmosphere=True
r.VirtualTextures=True

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum
